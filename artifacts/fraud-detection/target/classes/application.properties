server.port=${PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

spring.datasource.url=${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/fraud_detection?serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:fraud_app}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA creates or updates the two simple tables when the app starts.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false
